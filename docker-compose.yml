services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ktr
      POSTGRES_PASSWORD: ktr-hp
      POSTGRES_DB: ktr_kiosk_db
    ports:
      - "5433:5432"   # host:container
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    # No host port needed; backend accesses via internal DNS "redis"
    volumes:
      - redis_data:/data

  backend:
    build: .
    command: python run.py
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
  redis_data:
