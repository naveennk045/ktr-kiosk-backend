<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Edit Category</title>
  </head>
  <body>
    <h1>Edit Category</h1>
    <p><a href="/admin/categories">Back</a></p>
    <form method="post" action="/admin/categories/{{ category.legacy_id }}/edit">
      <div>
        <label>Name</label>
        <input type="text" name="name" value="{{ category.name }}" required />
      </div>
      <div>
        <label>Description</label>
        <textarea name="description">{{ category.description or '' }}</textarea>
      </div>
      <button type="submit">Save</button>
    </form>
  </body>
  </html>
