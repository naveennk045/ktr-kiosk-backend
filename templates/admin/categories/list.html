<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Categories</title>
  </head>
  <body>
    <h1>Categories</h1>
    <p><a href="/admin">Back</a> | <a href="/admin/categories/new">New Category</a></p>
    <table border="1" cellpadding="6" cellspacing="0">
      <thead>
        <tr>
          <th>Legacy ID</th>
          <th>Name</th>
          <th>Description</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for c in categories %}
        <tr>
          <td>{{ c.legacy_id }}</td>
          <td>{{ c.name }}</td>
          <td>{{ c.description or '' }}</td>
          <td>
            <a href="/admin/categories/{{ c.legacy_id }}/edit">Edit</a>
            <form method="post" action="/admin/categories/{{ c.legacy_id }}/delete" style="display:inline" onsubmit="return confirm('Delete?')">
              <button type="submit">Delete</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </body>
  </html>
